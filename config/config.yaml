preferences:
  timezone: "Europe/London"

schedule:
  # --- DAILY Shower Ready ---
  - name: "Pre-load ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT"]
    time: "05:00"
    temperature: 50

  - name: "Legionella Cycle ON"
    days: ["SUN"]
    time: "05:00"
    temperature: 60

  - name: "Pre-load OFF"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "06:00"
    temperature: 35

  # --- DAILY Shower Recharge ---
  - name: "Xmas: Shower Recharge ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "10:00"
    temperature: 50

  - name: "Xmas: Shower Recharge OFF"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "10:30"
    temperature: 35

  # --- DAILY (Evening Top-up) ---
  - name: "Daily: Evening Top-up ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:00"
    temperature: 50

  - name: "Daily: Evening Top-up OFF (Return to base)"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:30"
    temperature: 35