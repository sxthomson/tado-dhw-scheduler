preferences:
  timezone: "Europe/London"

schedule:
  # --- DAILY Shower Ready ---
  - name: "Pre-load ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT"]
    time: "05:00"
    temperature: 50

  - name: "Legionella Cycle ON"
    days: ["SUN"]
    time: "05:00"
    temperature: 50

  - name: "Pre-load OFF"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "06:00"
    temperature: 35

  - name: "Test"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "21:30"
    temperature: 60

  # --- DAILY Shower Recharge ---
  - name: "Mon-Thu: Shower Recharge ON"
    days: ["MON", "TUE", "WED", "THU"]
    time: "07:45"
    temperature: 50

  - name: "Mon-Thu: Shower Recharge OFF"
    days: ["MON", "TUE", "WED", "THU"]
    time: "08:15"
    temperature: 35

  # --- FRIDAY TO SUNDAY (Weekend/Hybrid) ---
  - name: "Fri-Sun: Shower Recharge ON"
    days: ["FRI", "SAT", "SUN"]
    time: "08:45"
    temperature: 50

  - name: "Fri-Sun: Shower Recharge OFF"
    days: ["FRI", "SAT", "SUN"]
    time: "09:15"
    temperature: 35

  # --- DAILY (Evening Top-up) ---
  - name: "Daily: Evening Top-up ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:00"
    temperature: 50

  - name: "Daily: Evening Top-up OFF (Return to base)"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:30"
    temperature: 35