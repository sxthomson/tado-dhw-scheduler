preferences:
  timezone: "Europe/London"

  # How long to respect a manual boost via the Tado app before the
  # schedule reasserts control. Tune freely -- no redeploy needed.
  override_grace_minutes: 60

schedule:
  # --- DAILY Shower Ready ---

  - name: "Pre-load ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "04:45"
    temperature: 60

  - name: "Pre-load OFF"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "05:30"
    temperature: 30

  # --- DAILY (Evening Top-up) ---
  - name: "Daily: Evening Top-up ON"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:00"
    temperature: 50

  - name: "Daily: Evening Top-up OFF"
    days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
    time: "16:30"
    temperature: 30

# --- Optional: weather-driven max flow temperature + room telemetry ----------
# Not in the template seed on purpose: add these to the live /tado/config
# parameter by hand (editing the template's ConfigParameter overwrites the live
# value). Missing or `enabled: false` = off; DHW is unaffected either way.
telemetry:
  enabled: true            # log rooms/weather/flow every 15 min (TADO_TELEMETRY_V1)

flow_temperature:
  enabled: true
  dry_run: true            # log what it would set without writing; flip once happy
  # Outdoor temp (C) -> where to put the app's Maximum Flow Temperature SLIDER.
  # Slider values, not flow temps: Tado scales them down by its own weather
  # curve (~0.8 x slider + 3 at 10C outdoor). Linear between points, flat beyond.
  curve:
    - { outdoor_c: 8, slider_c: 65 }   # mild (8C and warmer): the normal value
    - { outdoor_c: 3, slider_c: 67 }
    - { outdoor_c: 0, slider_c: 70 }   # freezing and below: the max
  min_change_c: 2              # don't move the slider for smaller changes
  override_grace_minutes: 720  # respect a manual slider change in the app this long
