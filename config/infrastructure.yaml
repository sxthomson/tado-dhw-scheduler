AWSTemplateFormatVersion: '2010-09-09'
Description: Full Stack EC2 (t4g.nano IPv6) + ECR + OIDC Auth for GitHub Actions

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: AWS::EC2::KeyPair::KeyName
  
  MyIP:
    Description: Your Public IPv6 address (e.g., 2a00:1f18:xxxx::/128)
    Type: String

  InstanceType:
    Description: EC2 instance type (arm64)
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro]

  GitHubUserName:
    Description: Your GitHub Username (e.g., 'sxthomson')
    Type: String

  GitHubRepoName:
    Description: Your GitHub Repository Name
    Type: String

  InstanceTargetTag:
    Description: The tag used by AWS SSM and GitHub Actions to identify this instance
    Type: String
    Default: tado-dhw-scheduler

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: 
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tado-github-deploy-role
      Description: Role assumed by GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubUserName}/${GitHubRepoName}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess # Allows GitHub to trigger deploy scripts

  TadoRepo:
    Type: AWS::ECR::Repository
    Properties: 
      RepositoryName: !Ref GitHubRepoName
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
                "action": { "type": "expire" }
              }
            ]
          }

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: { Service: [ec2.amazonaws.com] }
          Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # Replaces the need for SSH

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2InstanceRole]

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from my IPv6 only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: !Ref MyIP

  TadoServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
      Tags:
        - Key: Name
          Value: !Ref InstanceTargetTag
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf update -y
          dnf install -y docker git amazon-ssm-agent
          systemctl start docker
          systemctl enable docker
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          usermod -a -G docker ec2-user
          
          # Create persistent state folders on the host
          mkdir -p /home/ec2-user/tado-config
          mkdir -p /home/ec2-user/tado-storage
          chown -R ec2-user:ec2-user /home/ec2-user/tado-config
          chown -R ec2-user:ec2-user /home/ec2-user/tado-storage

Outputs:
  InstanceId:
    Value: !Ref TadoServer
  ECRRepoUrl:
    Value: !GetAtt TadoRepo.RepositoryUri
  GitHubRoleArn:
    Value: !GetAtt GithubDeployRole.Arn