AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Tado DHW Scheduler - serverless. A Lambda reconciles the DHW setpoint on a
  cron schedule (EventBridge Scheduler). Config lives in an SSM String param;
  OAuth tokens live in an SSM SecureString param. No idle compute, no IPv4.

Parameters:
  ConfigParamName:
    Type: String
    Default: /tado/config
    Description: SSM String parameter holding the (human-editable) schedule YAML.
  TokenParamName:
    Type: String
    Default: /tado/token
    Description: >
      SSM SecureString parameter holding the OAuth tokens. NOT created here
      (CloudFormation cannot create SecureString params) -- it is seeded by
      scripts/bootstrap_auth.py. The Lambda is granted access to it by ARN.
  LastAppliedParamName:
    Type: String
    Default: /tado/last_applied
    Description: >
      SSM String parameter holding the setpoint the reconciler last wrote.
      Lets it tell "schedule moved on" apart from "a manual boost happened"
      so it can respect an app-driven boost for a grace window instead of
      overwriting it. Operational state only -- not meant to be hand-edited.
  FlowLastAppliedParamName:
    Type: String
    Default: /tado/flow_last_applied
    Description: >
      SSM String parameter holding the max flow temperature slider value the
      reconciler last wrote. Same purpose as LastAppliedParamName, for the flow
      ceiling instead of DHW -- kept separate so neither reconciler can clobber
      the other's state. Operational state only -- not meant to be hand-edited.
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: >
      How often the reconciler runs. The flow/telemetry slow loop assumes
      5-minute ticks (main.TICK_SECONDS) -- change both together.
  ScheduleTimezone:
    Type: String
    Default: Europe/London

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Timeout: 120
    MemorySize: 128

Resources:
  # Human-editable schedule. Edit this in the console (Systems Manager >
  # Parameter Store) and the next invocation picks it up.
  ConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref ConfigParamName
      Type: String
      Tier: Standard
      Description: Tado DHW schedule (edit here to change the schedule; no redeploy needed).
      Value: |
        preferences:
          timezone: "Europe/London"

          # How long to respect a manual boost via the Tado app before the
          # schedule reasserts control. Tune freely -- no redeploy needed.
          override_grace_minutes: 60

        schedule:
          # --- DAILY Shower Ready ---

          - name: "Pre-load ON"
            days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
            time: "04:45"
            temperature: 60

          - name: "Pre-load OFF"
            days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
            time: "05:30"
            temperature: 30

          # --- DAILY (Evening Top-up) ---
          - name: "Daily: Evening Top-up ON"
            days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
            time: "16:00"
            temperature: 50

          - name: "Daily: Evening Top-up OFF"
            days: ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"]
            time: "16:30"
            temperature: 30

  # Operational state the reconciler owns end-to-end (never hand-edited):
  # the setpoint it last wrote, used to detect manual overrides. Seeded empty.
  LastAppliedParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref LastAppliedParamName
      Type: String
      Tier: Standard
      Description: Reconciler-owned state (last-applied setpoint) -- do not hand-edit.
      Value: '{}'

  # Same as above, for the max flow temperature slider. Separate parameter so the
  # DHW reconciler's whole-object saves can never wipe flow state (or vice versa).
  FlowLastAppliedParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref FlowLastAppliedParamName
      Type: String
      Tier: Standard
      Description: Reconciler-owned state (last-applied max flow slider) -- do not hand-edit.
      Value: '{}'

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tado-dhw-scheduler
      CodeUri: src/
      Handler: main.handler
      Description: Reconciles Tado DHW setpoint against the schedule, and the max flow ceiling against the weather.
      # EventBridge Scheduler invokes asynchronously; Lambda's default 2 retries could
      # overlap the next tick and race the OAuth token refresh. Every tick is an
      # idempotent reconcile anyway, so the next one (<=5 min) is the retry.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 240
      Environment:
        Variables:
          CONFIG_PARAM_NAME: !Ref ConfigParamName
          TOKEN_PARAM_NAME: !Ref TokenParamName
          LAST_APPLIED_PARAM_NAME: !Ref LastAppliedParamName
          FLOW_LAST_APPLIED_PARAM_NAME: !Ref FlowLastAppliedParamName
      Policies:
        # Least privilege: read config + token + tracker state, write token
        # (on refresh) and tracker state (every reconcile) only.
        - Statement:
            - Sid: ReadConfigTokenAndTrackerState
              Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConfigParamName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParamName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LastAppliedParamName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FlowLastAppliedParamName}
            - Sid: WriteTokenOnRefreshAndTrackerState
              Effect: Allow
              Action: ssm:PutParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TokenParamName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LastAppliedParamName}
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${FlowLastAppliedParamName}
            - Sid: DecryptEncryptSsmSecureStrings
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
              # Scoped so this only works for SSM's own crypto operations.
              Resource: '*'
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        CronSchedule:
          Type: ScheduleV2   # EventBridge Scheduler
          Properties:
            ScheduleExpression: !Ref ScheduleExpression
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            # Exact scheduled time (a Scheduler context attribute), so the slow-loop
            # gate in main.is_slow_tick isn't thrown off by start-up jitter.
            Input: '{"scheduled_time": "<aws.scheduler.scheduled-time>"}'

Outputs:
  FunctionName:
    Value: !Ref SchedulerFunction
  ConfigParameterName:
    Description: Edit this parameter to change the schedule.
    Value: !Ref ConfigParamName
  TokenParameterName:
    Description: Seed this with scripts/bootstrap_auth.py before the first run.
    Value: !Ref TokenParamName
  LastAppliedParameterName:
    Description: Reconciler-owned override-tracking state -- do not hand-edit.
    Value: !Ref LastAppliedParamName
  FlowLastAppliedParameterName:
    Description: Reconciler-owned max flow slider state -- do not hand-edit (reset to {} to end a manual override early).
    Value: !Ref FlowLastAppliedParamName
